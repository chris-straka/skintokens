[workspace]
resolver = "2"
members = ["crates/skintokens", "crates/skintokens-nn", "crates/skintokens-encoder"]

[workspace.package]
edition = "2021"
version = "0.2.0"
repository = "https://github.com/chris-straka/skintokens"

[workspace.dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
anyhow = "1"

[profile.release]
debug = false
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 2
