name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo build --locked --release --workspace --all-targets --no-default-features
      - run: cargo test --locked --release --workspace --no-default-features

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo build --locked --release --workspace --all-targets
      - run: cargo test --locked --release --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install pillow
      - run: cargo build --locked --release -p creature-rig
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
