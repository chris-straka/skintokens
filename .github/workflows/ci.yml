name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  license-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python3 - <<'PY'
          import json, subprocess, sys
          host = next(
              line.split(": ", 1)[1].strip()
              for line in subprocess.check_output(["rustc", "-vV"], text=True).splitlines()
              if line.startswith("host:")
          )
          meta = json.loads(subprocess.check_output([
              "cargo", "metadata", "--format-version", "1",
              "--no-default-features", "--filter-platform", host, "--locked",
          ]))
          pkgs = {p["id"]: p for p in meta["packages"]}
          nodes = {n["id"]: n["deps"] for n in meta["resolve"]["nodes"]}
          mit_roots = ["skintokens-geom", "creature-rig", "creature-bench", "skintokens-nn"]
          forbidden = {"skintokens", "skintokens-encoder"}
          by_name = {p["name"]: p["id"] for p in meta["packages"]}
          for root_name in mit_roots:
              root_id = by_name[root_name]
              assert "MIT" in (pkgs[root_id].get("license") or ""), f"{root_name} must be MIT"
              seen = set()
              stack = [root_id]
              while stack:
                  cur = stack.pop()
                  if cur in seen:
                      continue
                  seen.add(cur)
                  cname = pkgs[cur]["name"]
                  if cname in forbidden:
                      sys.exit(f"MIT boundary violation: {root_name} depends on GPL crate {cname}")
                  lic = pkgs[cur].get("license") or ""
                  parts = [p.strip() for p in lic.replace("(", "").replace(")", "").split(" OR ")]
                  if lic and all("GPL" in p for p in parts):
                      sys.exit(f"MIT boundary violation: {root_name} depends on {cname} ({lic})")
                  for d in nodes.get(cur, []):
                      stack.append(d["pkg"])
          print("MIT vs GPL-3.0-only boundary verified cleanly")
          PY

  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo build --locked --release --workspace --all-targets --no-default-features
      - run: cargo test --locked --release --workspace --no-default-features

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --workspace --all-targets
      - run: cargo test --locked --release --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install pillow
      - run: python3 -W error::ResourceWarning -m compileall -q tools bin/autorig
      - run: find . -maxdepth 3 -name '*.sh' -exec bash -n {} +
      - run: cargo build --locked --release -p creature-rig
      - run: python3 -W error::ResourceWarning -m unittest discover -s tools -p 'test_*.py'
